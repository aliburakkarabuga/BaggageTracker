<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bagaj Takip — Operasyon Paneli</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a23;
    --panel-2: #0f151d;
    --border: #263241;
    --text: #e6edf3;
    --muted: #7d8a9a;
    --accent: #3b82f6;
    --gold: #d4a017;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-right { display: flex; align-items: center; gap: 18px; font-size: 13px; }
  .conn-status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s;
  }
  .conn-dot.connecting { background: var(--amber); animation: pulse 1s infinite; }
  .conn-dot.live { background: var(--green); }
  .conn-dot.down { background: var(--red); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  a.link { color: var(--accent); text-decoration: none; font-size: 13px; }
  a.link:hover { text-decoration: underline; }
  #logout { color: var(--muted); cursor: pointer; font-size: 13px; background: none; border: none; }
  #logout:hover { color: var(--text); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    align-items: start;
  }
  main {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  aside {
    padding: 20px 20px;
    border-left: 1px solid var(--border);
    height: calc(100vh - 53px);
    overflow-y: auto;
    position: sticky;
    top: 53px;
  }
  aside h2 {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
    text-transform: uppercase;
  }
  .feed-item {
    padding: 9px 10px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    font-size: 12px;
    animation: slidein 0.2s ease;
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .feed-item .tag { font-weight: 600; }
  .feed-item .cp { color: var(--accent); }
  .feed-item .time { color: var(--muted); float: right; }
  .feed-empty { color: var(--muted); font-size: 13px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.3s;
  }
  .card.just-updated { border-color: var(--accent); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tag-id { font-weight: 700; font-size: 14px; }
  .passenger { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .flight-class {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .flight-class.priority { color: var(--gold); border-color: rgba(212, 160, 23, 0.4); }

  .timeline { display: flex; align-items: center; gap: 4px; margin: 4px 0; }
  .tl-step {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
  }
  .tl-step.done { background: var(--accent); }
  .tl-step.current { background: var(--green); }
  .tl-label {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
  }
  .tl-labels { display: flex; }
  .tl-labels > div { flex: 1; }

  .alerts { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge.info { background: rgba(59, 130, 246, 0.15); color: #7db4ff; }
  .badge.warning { background: rgba(210, 153, 34, 0.15); color: var(--amber); }
  .badge.critical { background: rgba(248, 81, 73, 0.15); color: var(--red); border: 1px solid rgba(248, 81, 73, 0.4); }

  .flag-btn {
    align-self: flex-start;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
  }
  .flag-btn:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>🧳 Bagaj Takip / Operasyon Paneli</h1>
  </div>
  <div class="header-right">
    <a class="link" href="/passenger.html" target="_blank">yolcu ekranını gör →</a>
    <div class="conn-status">
      <span id="conn-dot" class="conn-dot connecting"></span>
      <span id="conn-text">bağlanıyor...</span>
    </div>
    <button id="logout">çıkış yap</button>
  </div>
</header>

<div class="layout">
  <main id="cards"></main>
  <aside>
    <h2>Canlı Olay Akışı</h2>
    <div id="feed"><div class="feed-empty">Henüz olay yok.</div></div>
  </aside>
</div>

<script>
  const CHECKPOINTS = ["check-in", "sorting", "loading", "arrival-unload", "carousel"];
  const CHECKPOINT_LABELS = {
    "check-in": "Check-in",
    "sorting": "Ayrıştırma",
    "loading": "Yükleme",
    "arrival-unload": "İniş",
    "carousel": "Bant",
  };

  let bags = {};

  const cardsEl = document.getElementById("cards");
  const feedEl = document.getElementById("feed");
  const connDot = document.getElementById("conn-dot");
  const connText = document.getElementById("conn-text");

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString("tr-TR", { hour12: false });
  }

  function renderTimeline(bag) {
    const currentIdx = bag.checkpoint ? CHECKPOINTS.indexOf(bag.checkpoint) : -1;
    const steps = CHECKPOINTS.map((cp, i) => {
      let cls = "tl-step";
      if (i < currentIdx) cls += " done";
      else if (i === currentIdx) cls += " done current";
      return `<div class="${cls}"></div>`;
    }).join("");
    const labels = CHECKPOINTS.map((cp) => `<div class="tl-label">${CHECKPOINT_LABELS[cp]}</div>`).join("");
    return `<div class="timeline">${steps}</div><div class="tl-labels">${labels}</div>`;
  }

  function renderAlerts(bag) {
    if (!bag.alerts.length) return "";
    return `<div class="alerts">${bag.alerts
      .map((a) => `<span class="badge ${a.severity}">${a.type}</span>`)
      .join("")}</div>`;
  }

  function renderCard(bag) {
    const priorityCls = bag.priority ? "flight-class priority" : "flight-class";
    return `
      <div class="card" id="card-${bag.tagId}">
        <div class="card-top">
          <div>
            <div class="tag-id">${bag.tagId}</div>
            <div class="passenger">${bag.passenger} · ${bag.flightId}</div>
          </div>
          <span class="${priorityCls}">${bag.passengerClass}${bag.priority ? " ★" : ""}</span>
        </div>
        ${renderTimeline(bag)}
        ${renderAlerts(bag)}
        <button class="flag-btn" onclick="flagBag('${bag.tagId}')">incelemeye al</button>
      </div>
    `;
  }

  function renderAllCards() {
    const sorted = Object.values(bags).sort((a, b) => a.tagId.localeCompare(b.tagId));
    cardsEl.innerHTML = sorted.map(renderCard).join("");
  }

  function flashCard(tagId) {
    const el = document.getElementById(`card-${tagId}`);
    if (!el) return;
    el.classList.add("just-updated");
    setTimeout(() => el.classList.remove("just-updated"), 600);
  }

  function prependFeed(bag) {
    if (feedEl.querySelector(".feed-empty")) feedEl.innerHTML = "";
    const item = document.createElement("div");
    item.className = "feed-item";
    item.innerHTML = `<span class="tag">${bag.tagId}</span> → <span class="cp">${bag.checkpoint}</span><span class="time">${fmtTime(
      new Date().toISOString()
    )}</span>`;
    feedEl.prepend(item);
    while (feedEl.children.length > 40) feedEl.removeChild(feedEl.lastChild);
  }

  async function loadInitialBags() {
    const res = await fetch("/api/bags", { headers: { "x-api-key": "demo-havayolu-key-123" } });
    const list = await res.json();
    bags = Object.fromEntries(list.map((b) => [b.tagId, b]));
    renderAllCards();
  }

  async function flagBag(tagId) {
    const note = prompt(`${tagId} için not:`);
    if (note === null) return;
    await fetch(`/api/bags/${tagId}/flag`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": "demo-havayolu-key-123" },
      body: JSON.stringify({ note }),
    });
  }
  window.flagBag = flagBag;

  function connectWebSocket() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen = () => {
      connDot.className = "conn-dot live";
      connText.textContent = "canlı";
    };
    ws.onclose = () => {
      connDot.className = "conn-dot down";
      connText.textContent = "bağlantı koptu";
      setTimeout(connectWebSocket, 2000);
    };
    ws.onerror = () => ws.close();

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "event") {
        bags[msg.bag.tagId] = msg.bag;
        renderAllCards();
        flashCard(msg.bag.tagId);
        prependFeed(msg.bag);
      } else if (msg.type === "reset") {
        loadInitialBags();
        feedEl.innerHTML = '<div class="feed-empty">Henüz olay yok.</div>';
      }
    };
  }

  document.getElementById("logout").addEventListener("click", async () => {
    await fetch("/auth/logout", { method: "POST" });
    window.location.href = "/login.html";
  });

  loadInitialBags();
  connectWebSocket();
</script>
</body>
</html>
